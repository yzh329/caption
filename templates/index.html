<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Live Meeting Captions</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="app-shell">
    <section class="toolbar">
      <div>
        <h1>Local Live Captions</h1>
        <p>Fast English transcript plus delayed repaired paragraphs</p>
      </div>
      <div class="actions">
        <button id="preloadBtn" class="secondary" type="button">Preload all</button>
        <button id="refineBtn" class="secondary" type="button">Paragraphs</button>
        <button id="summaryBtn" class="secondary" type="button">Summary</button>
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
    </section>

    <section class="settings">
      <label>
        Audio source
        <select id="source"></select>
      </label>
      <button id="refreshSourcesBtn" class="secondary" type="button">Refresh</button>
      <label>
        Session name
        <input id="sessionName" placeholder="team-sync">
      </label>
      <label>
        Browser input
        <select id="browserInput"></select>
      </label>
      <input id="asrBackend" type="hidden" value="auto">
      <label>
        Whisper model
        <select id="whisperModel">
          <option value="tiny">tiny - smallest / fastest</option>
          <option value="small">small - light</option>
          <option value="medium">medium - balanced</option>
          <option value="large-v3">large-v3 - best quality</option>
          <option value="distil-large-v3" selected>distil-large-v3 - fast large</option>
        </select>
      </label>
      <input id="mlxModel" type="hidden" value="">
      <label>
        Device
        <select id="device">
          <option value="gpu" selected>gpu - Mac Metal / NVIDIA CUDA</option>
          <option value="cpu">cpu - fallback</option>
        </select>
      </label>
      <label>
        Compute
        <select id="computeType">
          <option value="auto" selected>auto</option>
          <option value="float16">float16 - NVIDIA GPU</option>
          <option value="int8">int8 - CPU fallback</option>
        </select>
      </label>
      <label>
        Subtitle refresh (seconds)
        <input id="chunkSeconds" type="number" min="1" max="20" step="1" value="3">
      </label>
      <label>
        Live translation model
        <input id="ollamaModel" list="translationModelOptions" value="qwen2.5:7b">
      </label>
      <label>
        Summary chunk model
        <select id="summaryOllamaModel">
          <option value="{{ default_summary_model }}" selected>Qwen3.8 27B - 3-bit (UD-IQ3_S)</option>
          <option value="gemma3:12b">small - gemma3:12b</option>
          <option value="qwen3:14b">medium - qwen3:14b</option>
          <option value="gpt-oss:20b">large - gpt-oss:20b</option>
        </select>
      </label>
      <label>
        Final summary model
        <select id="finalOllamaModel">
          <option value="{{ default_final_model }}" selected>Qwen3.8 27B - 3-bit (UD-IQ3_S)</option>
          <option value="qwen3:14b">small - qwen3:14b</option>
          <option value="gpt-oss:20b">medium - gpt-oss:20b</option>
          <option value="qwen3:30b">large - qwen3:30b</option>
        </select>
      </label>
      <datalist id="translationModelOptions">
        <option value="qwen2.5:7b" label="small, strong Chinese/English"></option>
        <option value="qwen3.5:9b-q4_K_M" label="Qwen3.5 9B Q4, translation trial"></option>
        <option value="qwen3:8b" label="small, newer multilingual"></option>
        <option value="gemma3:12b" label="medium, 128K context"></option>
        <option value="qwen2.5:14b" label="medium, better translation"></option>
      </datalist>
      <label>
        Text size
        <input id="textSize" type="range" min="14" max="30" step="1" value="18">
      </label>
      <label class="checkbox">
        <input id="translate" type="checkbox" checked>
        Translate to Chinese
      </label>
      <label class="checkbox">
        <input id="includeMic" type="checkbox" checked>
        Include mic
      </label>
      <label class="checkbox">
        <input id="autoSummary" type="checkbox" checked>
        Auto summary
      </label>
    </section>

    <section class="status-line">
      <span id="status">idle</span>
      <span id="savedPath"></span>
    </section>

    <section class="transcript-grid" aria-live="polite">
      <section class="transcript-panel live-panel">
        <div class="panel-heading">
          <h2>Live English</h2>
          <span>draft subtitles may update</span>
        </div>
        <div id="liveTranscript" class="transcript-stream"></div>
      </section>
      <section class="transcript-panel refined-panel">
        <div class="panel-heading">
          <h2>Complete Transcript</h2>
          <span>delayed paragraphs</span>
        </div>
        <div class="language-columns">
          <section class="language-pane">
            <div class="language-heading">English</div>
            <div id="englishTranscript" class="paragraph-stream"></div>
          </section>
          <section class="language-pane">
            <div class="language-heading">中文</div>
            <div id="chineseTranscript" class="paragraph-stream"></div>
          </section>
        </div>
      </section>
    </section>

    <section id="systemLog" class="system-log" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
